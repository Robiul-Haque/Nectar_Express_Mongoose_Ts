name: nectar-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nectar-backend-api:latest
    container_name: nectar-api
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8010/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nectar-network

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: nectar-redis
    ports:
      - "6379:6379"
    volumes:
      - nectar-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nectar-network

volumes:
  nectar-redis-data:
    name: nectar-redis-data

networks:
  nectar-network:
    name: nectar-network
    driver: bridge


